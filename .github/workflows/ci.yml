# En cada push levanta el stack completo y lo prueba de punta a punta.
name: CI

on:
  push:
  pull_request:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Crear .env de prueba
        run: |
          {
            echo "POSTGRES_DB=app"
            echo "POSTGRES_USER=app"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "HTTPS_PORT=8443"
          } > .env

      - name: Validar compose.yaml
        run: docker compose config --quiet

      - name: Levantar el stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Probar health por HTTPS
        run: curl -fsk https://localhost:8443/health | jq -e '.estado == "ok" and .base == "ok"'

      - name: Probar que guarda datos
        run: |
          curl -fsk https://localhost:8443/ | jq -e '.visitas >= 1'
          curl -fsk https://localhost:8443/ | jq -e '.visitas >= 2'

      - name: Probar cabeceras de seguridad
        run: curl -skI https://localhost:8443/health | grep -qi '^strict-transport-security'

      - name: Probar backup y restore
        run: ./scripts/backup.sh && ./scripts/verificar-backup.sh

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar todo
        if: always()
        run: docker compose down -v
